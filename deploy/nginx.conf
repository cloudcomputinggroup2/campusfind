# Nginx Configuration for CampusFind Django Application on AWS EC2
# Save to: /etc/nginx/sites-available/campusfind
# Symlink: ln -s /etc/nginx/sites-available/campusfind /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _;  # Or your EC2 Public DNS / Elastic IP / Custom Domain

    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static Files (Served via Whitenoise or Nginx direct alias)
    location /static/ {
        alias /home/ubuntu/campusfind/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Media Files (If not using S3 directly)
    location /media/ {
        alias /home/ubuntu/campusfind/media/;
        expires 7d;
    }

    # Health Check Endpoint
    location /health/ {
        proxy_pass http://127.0.0.1:8000/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy to Gunicorn WSGI Server
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
